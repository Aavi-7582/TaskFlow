services:

  postgres:
    image: postgres:16
    container_name: taskflow-postgres
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: taskflow-redis
    ports:
      - "6379:6379"

  worker1:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: taskflow-worker-1
    environment:
      DATABASE_URL: "postgresql://taskflow:taskflow@postgres:5432/taskflow"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - redis
      - postgres

  worker2:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: taskflow-worker-2
    environment:
      DATABASE_URL: "postgresql://taskflow:taskflow@postgres:5432/taskflow"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - redis
      - postgres

  worker3:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: taskflow-worker-3
    environment:
      DATABASE_URL: "postgresql://taskflow:taskflow@postgres:5432/taskflow"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data: